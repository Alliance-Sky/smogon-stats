<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Showdown Usage Stats</title>
    <meta name="description" content="View historical Pokemon Showdown usage statistics from 2014 to present." />
    <meta name="keywords" content="Pokemon, Pokemon Showdown, Smogon, Usage Stats, Competitive Pokemon, VGC, OU, UU, RU, NU, PU" />
    <meta name="author" content="Musaddik Temkar" />
    <meta property="og:title" content="Pokemon Showdown Usage Stats" />
    <meta property="og:description" content="View historical Pokemon Showdown usage statistics from 2014 to present." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pokemon Showdown Usage Stats" />
    <meta name="twitter:description" content="View historical Pokemon Showdown usage statistics from 2014 to present." />
    <link rel="icon" type="image/svg+xml" href="/favicon-scarlet.svg" id="favicon" />

    <script>
      (function() {
        try {
          var match = document.cookie.match(/(^| )theme=([^;]+)/);
          var theme = match ? match[2] : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark-red' : 'scarlet');
          document.documentElement.setAttribute('data-theme', theme);
          
          var bg = '#fdfaf6';
          var color = '#2d3748';
          if (theme === 'dark-red') { bg = '#0a0a0a'; color = '#f5f5f5'; }
          else if (theme === 'violet') { bg = '#0d1117'; color = '#f0f6fc'; }
          else if (theme === 'light-green') { bg = '#6ee7b7'; color = '#064e3b'; }
          
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = color;
          
          var favicon = document.getElementById('favicon');
          if (favicon) favicon.href = '/favicon-' + theme + '.svg';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
