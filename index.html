<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--helmet-->
    <meta name="author" content="Musaddik Temkar" />
    <link rel="icon" type="image/svg+xml" href="/favicon-scarlet.svg" id="favicon" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fafaf9" />
    <link rel="preconnect" href="https://play.pokemonshowdown.com" />

    <script>
      (function() {
        try {
          var match = document.cookie.match(/(^| )theme=([^;]+)/);
          var theme = match ? match[2] : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'violet' : 'scarlet');
          if (theme !== 'violet' && theme !== 'scarlet') theme = 'scarlet';
          document.documentElement.setAttribute('data-theme', theme);
          
          var bg = theme === 'violet' ? '#090d16' : '#fafaf9';
          var color = theme === 'violet' ? '#f8fafc' : '#0f172a';
          
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = color;
          
          var style = document.createElement('style');
          style.id = 'theme-init-style';
          style.innerHTML = 'html, body { background-color: ' + bg + '; color: ' + color + '; margin: 0; }';
          document.head.appendChild(style);
          
          var favicon = document.getElementById('favicon');
          if (favicon) favicon.href = '/favicon-' + theme + '.svg';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-state-->
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
